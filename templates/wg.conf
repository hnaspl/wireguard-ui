# Address updated at:     {{ .serverConfig.Interface.UpdatedAt }}
# Private Key updated at: {{ .serverConfig.KeyPair.UpdatedAt }}
[Interface]
Address = {{$first :=true}}{{range .serverConfig.Interface.Addresses }}{{if $first}}{{$first = false}}{{else}},{{end}}{{.}}{{end}}
ListenPort = {{ .serverConfig.Interface.ListenPort }}
PrivateKey = {{ .serverConfig.KeyPair.PrivateKey }}
{{if .globalSettings.MTU}}MTU = {{ .globalSettings.MTU }}{{end}}
{{- if .globalSettings.EnableAutoGenScripts}}
{{- if .globalSettings.PostUpScriptPath}}
PostUp = {{ .globalSettings.PostUpScriptPath }}
{{- else}}
PostUp = /etc/wireguard/postup.sh
{{- end}}
{{- else if .globalSettings.PostUpScriptPath}}
PostUp = INTERFACE=%i WG_SUBNETS="{{ .globalSettings.WgSubnets }}" LAN_ALL="{{ .globalSettings.LanAll }}" LAN_PROTECT="{{ .globalSettings.LanProtect }}" MASQ_OIF_PATTERN="{{ .globalSettings.MasqOifPattern }}" {{ .globalSettings.PostUpScriptPath }}
{{- else if or .serverConfig.Interface.PostUp .globalSettings.PostUpTemplate}}
PostUp = {{ if .serverConfig.Interface.PostUp }}{{ .serverConfig.Interface.PostUp }}{{ else }}{{ .globalSettings.PostUpTemplate }}{{ end }}
{{- end}}
{{- if .serverConfig.Interface.PreDown}}
PreDown = {{ .serverConfig.Interface.PreDown }}
{{- end}}
{{- if .globalSettings.EnableAutoGenScripts}}
{{- if .globalSettings.PostDownScriptPath}}
PostDown = {{ .globalSettings.PostDownScriptPath }}
{{- else}}
PostDown = /etc/wireguard/postdown.sh
{{- end}}
{{- else if .globalSettings.PostDownScriptPath}}
PostDown = INTERFACE=%i WG_SUBNETS="{{ .globalSettings.WgSubnets }}" LAN_ALL="{{ .globalSettings.LanAll }}" LAN_PROTECT="{{ .globalSettings.LanProtect }}" MASQ_OIF_PATTERN="{{ .globalSettings.MasqOifPattern }}" {{ .globalSettings.PostDownScriptPath }}
{{- else if or .serverConfig.Interface.PostDown .globalSettings.PostDownTemplate}}
PostDown = {{ if .serverConfig.Interface.PostDown }}{{ .serverConfig.Interface.PostDown }}{{ else }}{{ .globalSettings.PostDownTemplate }}{{ end }}
{{- end}}
Table = {{ .globalSettings.Table }}

{{range .clientDataList}}{{if eq .Client.Enabled true}}
# ID:           {{ .Client.ID }}
# Name:         {{ .Client.Name }}
# Email:        {{ .Client.Email }}
# Telegram:     {{ .Client.TgUserid }}
# Created at:   {{ .Client.CreatedAt }}
# Update at:    {{ .Client.UpdatedAt }}
{{- if .Client.IsSiteToSite}}
# Type:         Site-to-Site{{end}}
{{- if .Client.AdditionalNotes}}

# Notes:
# {{ .Client.AdditionalNotes }}{{end}}
[Peer]
PublicKey = {{ .Client.PublicKey }}
{{if .Client.PresharedKey}}PresharedKey = {{ .Client.PresharedKey }}{{end}}
AllowedIPs = {{$first :=true}}{{range .Client.AllocatedIPs }}{{if $first}}{{$first = false}}{{else}},{{end}}{{.}}{{end}}{{range .Client.ExtraAllowedIPs }},{{.}}{{end}}
{{if $.globalSettings.PersistentKeepalive}}PersistentKeepalive = {{ $.globalSettings.PersistentKeepalive }}{{end}}
{{if .Client.Endpoint}}Endpoint = {{ .Client.Endpoint }}{{end}}
{{end}}{{end}}
